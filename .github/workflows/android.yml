name: Android Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'   # required by AGP 9.1.1

      - name: Set up Android SDK (cmdline-tools)
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -o cmdline-tools.zip -sSL \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Install SDK packages
        run: |
          sdkmanager --update
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
        # ^ adjust android-35 / build-tools version to match your build.gradle's
        #   compileSdk / buildToolsVersion

      - name: Allow legacy Kotlin source sets (AGP 9 built-in Kotlin workaround)
        run: |
          if ! grep -q "android.disallowKotlinSourceSets" gradle.properties 2>/dev/null; then
            echo "android.disallowKotlinSourceSets=false" >> gradle.properties
          fi

      - name: Pin KSP to match Kotlin version
        run: |
          KOTLIN_VERSION=$(grep -oP '(?<=^kotlin = ")[^"]+' gradle/libs.versions.toml)
          echo "Detected Kotlin version: $KOTLIN_VERSION"

          KSP_VERSION=$(curl -s "https://repo1.maven.org/maven2/com/google/devtools/ksp/com.google.devtools.ksp.gradle.plugin/maven-metadata.xml" \
            | grep -oP "<version>${KOTLIN_VERSION}-[0-9.]+</version>" \
            | sed -E 's/<\/?version>//g' | sort -V | tail -1)

          if [ -z "$KSP_VERSION" ]; then
            echo "No matching KSP release found for Kotlin $KOTLIN_VERSION"
            exit 1
          fi
          echo "Pinning KSP to: $KSP_VERSION"
          sed -i "s/^googleDevtoolsKsp = \".*\"/googleDevtoolsKsp = \"$KSP_VERSION\"/" gradle/libs.versions.toml

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'   # minimum required by AGP 9.1.1

      - name: Generate debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: '**/build/outputs/apk/**/*.apk'
